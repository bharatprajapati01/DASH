# Optional: a local PostgreSQL that matches server/.env.example
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fibnk
      POSTGRES_PASSWORD: fibnk
      POSTGRES_DB: fibnk
    ports:
      - "5432:5432"
    volumes:
      - fibnk-data:/var/lib/postgresql/data
volumes:
  fibnk-data:
